<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score de Pesca</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.16 0.02 250);
    --bg-elevated: oklch(0.21 0.02 250);
    --bg-elevated-2: oklch(0.26 0.02 250);
    --text: oklch(0.96 0.01 250);
    --text-dim: oklch(0.72 0.02 250);
    --text-faint: oklch(0.55 0.02 250);
    --border: oklch(0.32 0.02 250);
    --accent: oklch(0.75 0.12 210);
    --accent-text: oklch(0.15 0.02 210);
    --danger: oklch(0.62 0.20 25);
    --danger-bg: oklch(0.30 0.09 25);
    --warning: oklch(0.78 0.15 75);
    --v-excelente: oklch(0.72 0.19 150);
    --v-bom: oklch(0.76 0.17 128);
    --v-razoavel: oklch(0.80 0.16 95);
    --v-fraco: oklch(0.72 0.18 55);
    --v-naovale: oklch(0.60 0.20 25);
    --shadow: 0 8px 24px oklch(0 0 0 / 0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: oklch(0.97 0.006 250);
      --bg-elevated: oklch(1 0 0);
      --bg-elevated-2: oklch(0.94 0.006 250);
      --text: oklch(0.20 0.02 250);
      --text-dim: oklch(0.42 0.02 250);
      --text-faint: oklch(0.58 0.02 250);
      --border: oklch(0.87 0.01 250);
      --accent: oklch(0.52 0.13 210);
      --accent-text: oklch(0.99 0 0);
      --danger: oklch(0.55 0.20 25);
      --danger-bg: oklch(0.90 0.07 25);
      --warning: oklch(0.62 0.15 75);
      --shadow: 0 8px 24px oklch(0 0 0 / 0.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 480px at 50% -180px, color-mix(in oklch, var(--accent) 10%, transparent), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 24px;
  }
  body.dev { padding-bottom: 90px; }
  button { font-family: inherit; }
  .app { max-width: 1080px; margin: 0 auto; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
  .layout { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .layout-left, .layout-right { display: flex; flex-direction: column; gap: 14px; }

  .header { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-icon { font-size: 22px; line-height: 1; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.01em; color: var(--text-dim); }

  .search-wrap { position: relative; }
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .search-box svg { flex: none; opacity: 0.6; }
  .search-input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-size: 17px; }
  .search-input::placeholder { color: var(--text-faint); }
  .search-clear { flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg-elevated-2); color: var(--text-dim); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .results-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); z-index: 20; max-height: 320px; overflow-y: auto; }
  .result-item { width: 100%; text-align: left; border: none; background: none; color: var(--text); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--border); min-height: 44px; cursor: pointer; }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover, .result-item:active { background: var(--bg-elevated-2); }
  .result-name { font-size: 16px; font-weight: 600; }
  .result-meta { font-size: 13px; color: var(--text-faint); }
  .results-empty { padding: 20px 16px; color: var(--text-faint); font-size: 14px; text-align: center; }

  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .saved-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px 7px 10px; font-size: 13px; color: var(--text-dim); }
  .saved-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .map-card { position: relative; height: 260px; border-radius: 24px; overflow: hidden; border: 1px solid var(--border); cursor: crosshair;
    background: repeating-linear-gradient(135deg, color-mix(in oklch, var(--accent) 7%, var(--bg-elevated)) 0 2px, var(--bg-elevated) 2px 26px), var(--bg-elevated);
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--text) 4%, transparent); transition: height 0.35s cubic-bezier(0.4,0,0.2,1); }
  .map-card.expanded {
    position: fixed; inset: 0; height: auto; width: auto;
    border-radius: 0; border: none; z-index: 900;
  }
  body.map-open { overflow: hidden; }
  /* `position: sticky` cria um contexto de empilhamento que prendia o overlay
     fixo do mapa por baixo do resto da página. */
  body.map-open .layout-left { position: static; }
  body.map-open .app > *:not(.layout), body.map-open .layout-right { visibility: hidden; }
  /* Expandido, o canto superior esquerdo é da pesquisa: os controlos de zoom
     mudam para a direita, por baixo do botão de localizar. */
  .map-card.expanded .leaflet-top.leaflet-left { top: 96px; left: auto; right: 10px; }
  .map-card.expanded .leaflet-top.leaflet-left .leaflet-control { margin-left: 0; margin-right: 0; }
  .map-search { position: absolute; top: 10px; left: 12px; width: calc(100% - 76px); max-width: 340px; z-index: 860; }
  .map-search .search-box { box-shadow: var(--shadow); padding: 10px 12px; }
  .map-search .search-input { font-size: 15px; }
  .map-layers {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; background: color-mix(in oklch, var(--bg-elevated) 88%, transparent);
    border: 1px solid var(--border); border-radius: 10px; padding: 3px; z-index: 800;
  }
  /* expandido, o topo é da pesquisa: as camadas passam para baixo dela */
  .map-card.expanded .map-layers { top: 58px; left: 12px; transform: none; }
  .map-layers button { border: none; background: none; color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 8px; cursor: pointer; min-height: 32px; }
  .map-layers button.active { background: var(--accent); color: var(--accent-text); }
  .spot-badge {
    display: flex; align-items: center; justify-content: center;
    min-width: 38px; height: 30px; padding: 0 8px;
    border-radius: 999px; font: 800 16px/1 system-ui, sans-serif;
    color: #0d1117; border: 2.5px solid rgba(255,255,255,.65);
    box-shadow: 0 2px 8px rgba(0,0,0,.55); white-space: nowrap;
  }
  .spot-badge.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
  .user-dot { position: relative; display: block; width: 16px; height: 16px; border-radius: 50%; background: #1f8fff; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.5); }
  .user-dot::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; background: rgba(31,143,255,.45); animation: userPulse 2s ease-out infinite; }
  @keyframes userPulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
  .spot-badge.pending { background: var(--bg-elevated-2); color: var(--text-faint); border-color: var(--border); }
  .map-legend {
    position: absolute; bottom: 26px; left: 12px; z-index: 800;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: color-mix(in oklch, var(--bg-elevated) 80%, transparent);
    border-radius: 8px; padding: 5px 9px; font-size: 10.5px; color: var(--text-dim);
  }
  .map-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Painel lateral do mapa expandido (estilo Google Maps) */
  .map-panel {
    position: absolute; z-index: 850; overflow-y: auto;
    background: var(--bg-elevated); border: 1px solid var(--border);
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
    left: 0; right: 0; bottom: 0; max-height: 62vh; border-radius: 20px 20px 0 0; padding: 14px 16px 20px;
  }
  .map-panel-grab { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: -4px auto 2px; }
  .mp-head { display: flex; align-items: flex-start; gap: 12px; }
  .mp-score { flex: none; width: 62px; height: 62px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; color: #0d1117; }
  .mp-score b { font-size: 24px; line-height: 1; }
  .mp-score span { font-size: 9.5px; font-weight: 700; opacity: .75; }
  .mp-title { font-size: 17px; font-weight: 800; margin: 0; }
  .mp-sub { font-size: 13px; color: var(--text-faint); margin: 2px 0 0; }
  .mp-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elevated-2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mp-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .mp-tag { background: var(--bg-elevated-2); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; }
  .mp-block { display: flex; flex-direction: column; gap: 4px; }
  .mp-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); }
  .mp-txt { font-size: 13.5px; color: var(--text-dim); margin: 0; }
  .mp-warn { background: var(--danger-bg); border: 1.5px solid var(--danger); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .mp-warn.amarelo { background: color-mix(in oklch, var(--warning) 13%, var(--bg-elevated)); border-color: var(--warning); }
  .mp-warn.laranja { background: color-mix(in oklch, var(--v-fraco) 15%, var(--bg-elevated)); border-color: var(--v-fraco); }
  .mp-cta { border: none; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 14px; padding: 12px; cursor: pointer; min-height: 44px; }
  @media (min-width: 860px) {
    .map-panel { left: 12px; top: 68px; bottom: 12px; right: auto; width: 370px; max-height: none; border-radius: 20px; padding: 18px 18px 22px; }
    .map-panel-grab { display: none; }
    .map-card.expanded .map-layers { top: 10px; left: auto; right: 56px; }
    .map-search { width: 370px; max-width: none; }
  }
  .map-hint { position: absolute; bottom: 10px; left: 12px; font-size: 11px; color: var(--text-faint); background: color-mix(in oklch, var(--bg-elevated) 70%, transparent); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  .map-caption { position: absolute; top: 10px; left: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.02em; color: var(--text-faint); background: color-mix(in oklch, var(--bg-elevated) 70%, transparent); padding: 3px 8px; border-radius: 6px; }
  .map-coords { position: absolute; bottom: 10px; right: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; color: var(--text-faint); }
  .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-svg path { fill: none; stroke: color-mix(in oklch, var(--text) 30%, transparent); stroke-width: 1.5; }
  .map-pin { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--score-color, var(--accent)); border: 3px solid var(--bg-elevated); box-shadow: 0 0 0 2px var(--score-color, var(--accent)); transform: translate(-50%, -50%); transition: left 0.2s ease, top 0.2s ease; pointer-events: none; }
  .map-pin::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: color-mix(in oklch, var(--score-color, var(--accent)) 35%, transparent); animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(2.1); opacity: 0; } }
  .map-expand, .map-locate { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: color-mix(in oklch, var(--bg-elevated) 85%, transparent); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .map-locate { top: 52px; z-index: 800; }

  .skel { background: linear-gradient(90deg, var(--bg-elevated-2), var(--border), var(--bg-elevated-2)); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 10px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .safety-banner { display: flex; align-items: flex-start; gap: 12px; background: var(--danger-bg); color: var(--text); border: 2px solid var(--danger); border-radius: 16px; padding: 14px 16px; }
  .safety-banner.nivel-amarelo { background: color-mix(in oklch, var(--warning) 14%, var(--bg-elevated)); border-color: var(--warning); }
  .safety-banner.nivel-amarelo .safety-title { color: var(--warning); }
  .safety-banner.nivel-laranja { background: color-mix(in oklch, var(--v-fraco) 16%, var(--bg-elevated)); border-color: var(--v-fraco); }
  .safety-banner.nivel-laranja .safety-title { color: var(--v-fraco); }
  .safety-banner .icon { font-size: 26px; line-height: 1; flex: none; }
  .safety-title { font-weight: 800; font-size: 16px; color: var(--danger); margin: 0 0 2px; }
  .safety-text { font-size: 14px; color: var(--text); margin: 0; }

  .score-card { position: relative; overflow: hidden; background: var(--bg-elevated); border-radius: 28px; padding: 40px 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .score-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(220px 160px at 50% 0%, color-mix(in oklch, var(--score-color, var(--accent)) 22%, transparent), transparent 75%); pointer-events: none; }
  .score-card > * { position: relative; }
  .score-place { font-size: 15px; font-weight: 600; color: var(--text-dim); }
  .score-number { font-size: clamp(88px, 28vw, 128px); font-weight: 800; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--score-color, var(--accent)); }
  .score-number.dashed { color: var(--text-faint); }
  .score-scale { font-size: 20px; font-weight: 600; color: var(--text-faint); vertical-align: top; }
  .score-verdict { font-size: 24px; font-weight: 800; color: var(--score-color, var(--accent)); padding: 4px 16px; border-radius: 999px; background: color-mix(in oklch, var(--score-color, var(--accent)) 16%, transparent); }
  .score-updated { font-size: 13px; color: var(--text-faint); }
  .partial-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--warning); background: color-mix(in oklch, var(--warning) 16%, transparent); border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); border-radius: 999px; padding: 6px 12px; }

  .section { background: color-mix(in oklch, var(--bg-elevated) 70%, var(--bg)); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .section-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0; }

  .windows-list { display: flex; flex-direction: column; gap: 8px; }
  .window-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-elevated-2); border-radius: 12px; padding: 12px 14px; }
  .window-when { font-weight: 700; font-size: 15px; }
  .window-tag { font-size: 12px; color: var(--text-faint); }
  .window-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: var(--accent-text); background: var(--score-color, var(--accent)); }
  .forecast-readout { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--text-faint); min-height: 22px; }
  .forecast-readout b { font-size: 19px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
  .forecast-readout .verd { font-size: 12.5px; font-weight: 700; }
  .forecast-wrap { position: relative; cursor: pointer; touch-action: pan-y; }
  .forecast-grid { position: absolute; left: 0; right: 0; top: 0; height: 72px; pointer-events: none; }
  .forecast-grid span { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); opacity: .55; }
  .forecast-grid i { position: absolute; right: 0; top: -8px; font-size: 9.5px; font-style: normal; color: var(--text-faint); background: var(--bg); padding-left: 3px; }
  .forecast-bar { position: relative; display: flex; gap: 2px; align-items: flex-end; height: 72px; }
  .forecast-bar .bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 3px; background: var(--score-color, var(--accent)); transition: opacity .12s; }
  .forecast-bar.has-sel .bar { opacity: .42; }
  .forecast-bar .bar.sel { opacity: 1; outline: 2px solid var(--text); outline-offset: 1px; border-radius: 3px; }
  .forecast-hours { display: flex; font-size: 10px; color: var(--text-faint); margin-top: 3px; }
  .forecast-hours span { flex: none; text-align: left; }
  .forecast-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); }
  .forecast-labels .seg { flex: none; overflow: hidden; white-space: nowrap; border-left: 1px solid var(--border); padding-left: 4px; }
  .forecast-labels .seg:first-child { border-left: none; padding-left: 0; }
  .tipo-label { font-size: 12px; font-weight: 700; color: var(--text-faint); padding: 0 4px 0 8px; align-self: center; }
  .map-slot { position: absolute; inset: 0; z-index: 0; }
  #leafletMap { position: absolute; inset: 0; background: var(--bg-elevated); }
  .map-caption, .map-hint, .map-coords, .map-expand { z-index: 800; }
  .map-card .leaflet-control-attribution { background: color-mix(in oklch, var(--bg-elevated) 80%, transparent); color: var(--text-faint); font-size: 9px; }
  .map-card .leaflet-control-attribution a { color: var(--text-dim); }
  .chev svg { display: block; }
  .view-toggle { display: flex; gap: 4px; background: var(--bg-elevated-2); border-radius: 10px; padding: 3px; align-self: flex-start; }
  .view-toggle button { border: none; background: none; color: var(--text-dim); font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; min-height: 32px; cursor: pointer; }
  .view-toggle button.active { background: var(--bg-elevated); color: var(--text); box-shadow: 0 1px 3px oklch(0 0 0 / 0.2); }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--bg-elevated-2); border-radius: 12px; padding: 10px 4px 8px; min-height: 44px; }
  .week-day-label { font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; }
  .week-day-bar-track { width: 8px; height: 56px; border-radius: 999px; background: var(--bg-elevated); display: flex; align-items: flex-end; overflow: hidden; }
  .week-day-bar-fill { width: 100%; border-radius: 999px; }
  .week-day-score { font-size: 13px; font-weight: 700; }

  .factors-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none; color: var(--text); padding: 0; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; min-height: 44px; }
  .factors-toggle .chev { transition: transform 0.2s ease; color: var(--text-dim); }
  .factors-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .factors-list { display: flex; flex-direction: column; gap: 14px; }
  .factor-row { display: flex; flex-direction: column; gap: 6px; }
  .factor-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .factor-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .factor-score { font-weight: 700; font-size: 14px; color: var(--text-dim); }
  .factor-track { height: 8px; border-radius: 999px; background: var(--bg-elevated-2); overflow: hidden; }
  .factor-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .factor-note { font-size: 13px; color: var(--text-faint); margin: 0; }

  .technique-row { display: flex; align-items: center; gap: 14px; }
  .technique-icon { font-size: 30px; flex: none; }
  .technique-name { font-weight: 800; font-size: 18px; }
  .technique-why { font-size: 14px; color: var(--text-dim); margin: 2px 0 0; }
  .tips-list { margin: 4px 0 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 5px; }
  .tips-list li { font-size: 13.5px; color: var(--text-dim); }
  .tips-list b { color: var(--text); font-weight: 600; }

  .species-list { display: flex; flex-wrap: wrap; gap: 8px; }

/* ============================ UTIL ============================ */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clamp01 = (x) => clamp(x, 0, 1);
function interp(pts, x) { // interpolação linear em [[x,y],...] ordenado
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (x <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
  }
  return pts[pts.length - 1][1];
}
function trap(x, [a, b, c, d]) {
  if (x == null || x <= a || x >= d) return x == null ? null : 0;
  if (x < b) return (x - a) / (b - a);
  if (x <= c) return 1;
  return (d - x) / (d - c);
}
const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function diaLabel(iso, hoje) {
  const d = new Date(iso + "T12:00");
  const h = new Date(hoje + "T12:00");
  const diff = Math.round((d - h) / 86400000);
  return diff === 0 ? "Hoje" : diff === 1 ? "Amanhã" : DIAS[d.getDay()];
}

/* Fase da lua — método sinódico (validado contra os eclipses de 2026) */
const SYNODIC = 29.53058867;
function moonInfo(date) {
  const anchor = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  const age = (((date.getTime() / 86400000 - anchor) % SYNODIC) + SYNODIC) % SYNODIC;
  const illum = (1 - Math.cos(2 * Math.PI * age / SYNODIC)) / 2;
  let label;
  if (age < 1.8 || age > 27.7) label = "Lua nova";
  else if (age < 6.6) label = "Crescente fina";
  else if (age < 8.6) label = "Quarto crescente";
  else if (age < 13) label = "Crescente gibosa";
  else if (age < 16.6) label = "Lua cheia";
  else if (age < 21) label = "Minguante gibosa";
  else if (age < 23) label = "Quarto minguante";
  else label = "Minguante fina";
  return { age, illum, label };
}

function shoreTypeGuess(lat, lon) {
  if (albufeiraPerto(lat, lon)) return "albufeira";
  for (const [la, lb, lo, lhi] of ESTUARIOS) if (lat >= la && lat <= lb && lon >= lo && lon <= lhi) return "estuario";
  // Sem isto, uma vila do interior (Beringel, a 60 km do mar) era tratada
  // como praia, com marés e tainhas.
  let d = 1e9;
  for (const s of SPOTS) d = Math.min(d, distKm(lat, lon, s[1], s[2]));
  return d > 25 ? "interior" : "praia";
}
// as 3 albufeiras mais próximas — para quem cai no interior
function albufeirasProximas(lat, lon, n) {
  return ALBUFEIRAS.map((a) => ({ a, km: distKm(lat, lon, a[1], a[2]) }))
    .sort((x, y) => x.km - y.km).slice(0, n || 3);
}

/* ====================== MOTOR DE ÁGUA DOCE ======================
   Modelo separado do mar: nem ondulação, nem maré, nem sal. A temperatura
   da água é o factor dominante e não tem fonte gratuita — é estimada a
   partir do ar por um air2water simplificado, e a app di-lo. */
const albufeiraPerto = (lat, lon) => {
  let best = null, bd = 1e9;
  for (const a of ALBUFEIRAS) {
    const d = distKm(lat, lon, a[1], a[2]);
    if (d < bd) { bd = d; best = a; }
  }
  return bd <= 6 ? { a: best, km: bd } : null;
};
// Tw(t) = Tw(t-1) + k·(Tar - Tw(t-1)); k menor em albufeiras fundas
function tempAgua(horas, iAgora) {
  const k = CFG.doce.kAgua;
  const dias = [];
  for (let i = 0; i < horas.length; i += 24) {
    const bloco = horas.slice(i, i + 24).map((h) => h.temp).filter((v) => v != null);
    if (bloco.length) dias.push(bloco.reduce((a, b) => a + b, 0) / bloco.length);
  }
  if (!dias.length) return null;
  let tw = dias[0];                       // arranca na média do primeiro dia
  const serie = [];
  for (const tar of dias) { tw = tw + k * (tar - tw); serie.push(tw); }
  const idx = Math.min(serie.length - 1, Math.floor(iAgora / 24));
  return { agora: serie[idx], serie, tend3d: idx >= 3 ? serie[idx] - serie[idx - 3] : 0 };
}
// ângulo solar aproximado (grau) — melhor que a hora do relógio
function anguloSolar(date, lat, lon) {
  const d = (date - new Date(date.getFullYear(), 0, 0)) / 864e5;
  const decl = 23.45 * Math.sin(2 * Math.PI * (284 + d) / 365) * Math.PI / 180;
  const hUTC = date.getUTCHours() + date.getUTCMinutes() / 60;
  const H = (hUTC - 12) * 15 + lon;
  const la = lat * Math.PI / 180, Hr = H * Math.PI / 180;
  return Math.asin(Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(Hr)) * 180 / Math.PI;
}

function buildHours(wx, sea) {
  const t = wx.hourly.time;
  const seaIdx = {};
  if (sea) sea.hourly.time.forEach((ts, i) => { seaIdx[ts] = i; });
  const g = (arr, i) => (arr && arr[i] != null ? arr[i] : null);
  return t.map((ts, i) => {
    const s = sea ? seaIdx[ts] : undefined;
    return {
      t: ts, i,
      p: g(wx.hourly.pressure_msl, i), vento: g(wx.hourly.wind_speed_10m, i),
      temp: g(wx.hourly.temperature_2m, i),
      dir: g(wx.hourly.wind_direction_10m, i), raj: g(wx.hourly.wind_gusts_10m, i),
      nuvens: g(wx.hourly.cloud_cover, i), chuva: g(wx.hourly.precipitation, i),
      hs: s != null ? g(sea.hourly.wave_height, s) : null,
      tp: s != null ? Math.max(g(sea.hourly.wave_period, s) || 0, g(sea.hourly.swell_wave_period, s) || 0) || null : null,
      sst: s != null ? g(sea.hourly.sea_surface_temperature, s) : null,
      eta: s != null ? g(sea.hourly.sea_level_height_msl, s) : null,
    };
  });
}
// Costa sul (Algarve) vs oeste — Sagres e a costa vicentina contam como oeste.
const tideLagMin = (lat, lon) => (lat < 37.3 && lon > -8.9 ? CFG.mareFaseMin.sul : CFG.mareFaseMin.oeste);
// Reamostra a série do modelo atrasando-a `min` minutos: real(t) = modelo(t - lag)
function shiftTide(hours, min) {
  const f = min / 60;
  const src = hours.map((h) => h.eta);
  const out = hours.map((h, i) => {
    const x = i - f, i0 = Math.floor(x), s = x - i0;
    const a = src[i0], b = src[i0 + 1];
    return (a == null || b == null) ? src[i] : a + (b - a) * s;
  });
  hours.forEach((h, i) => { h.eta = out[i] == null ? null : out[i]; });
}
function tideExtremes(hours) {
  const ext = [];
  for (let i = 1; i < hours.length - 1; i++) {
    const a = hours[i - 1].eta, b = hours[i].eta, c = hours[i + 1].eta;
    if (a == null || b == null || c == null) continue;
    const isMax = b > a && b >= c, isMin = b < a && b <= c;
    if (!isMax && !isMin) continue;
    const denom = a - 2 * b + c;
    const off = denom !== 0 ? clamp(0.5 * (a - c) / denom, -0.5, 0.5) : 0; // vértice da parábola
    const when = new Date(new Date(hours[i].t).getTime() + off * 3600000);
    const h = b - 0.25 * (a - c) * off;
    ext.push({ tipo: isMax ? "alta" : "baixa", when, eta: h, idx: i });
  }
  return ext;
}
function tideMeta(hours, ext) {
  // amplitude do ciclo atual vs. min/max das amplitudes disponíveis → viva/morta
  const ranges = [];
  for (let i = 1; i < ext.length; i++) ranges.push(Math.abs(ext[i].eta - ext[i - 1].eta));
  if (!ranges.length) return { viva: false, morta: false, pct: 0.5 };
  const lo = Math.min.apply(null, ranges), hi = Math.max.apply(null, ranges);
  const nowIdx = hours.findIndex((h) => new Date(h.t) > new Date());
  let cur = ranges[Math.floor(ranges.length / 2)];
  for (let i = 1; i < ext.length; i++) if (ext[i].idx >= nowIdx) { cur = Math.abs(ext[i].eta - ext[i - 1].eta); break; }
  const pct = hi > lo ? (cur - lo) / (hi - lo) : 0.5;
  return { viva: pct > 0.7, morta: pct < 0.3, pct };
}
function makeSuns(wx) { // ts do dia → {rise,set} em ms
  const map = {};
  wx.daily.time.forEach((d, i) => {
    map[d] = { rise: new Date(wx.daily.sunrise[i]).getTime(), set: new Date(wx.daily.sunset[i]).getTime() };
  });
  return map;
}
function luzPeriodo(ts, suns) {
  const day = ts.slice(0, 10);
  const s = suns[day];
  if (!s) return { periodo: "dia", sub: 0.7 };
  const t = new Date(ts).getTime(), win = CFG.luz.janelaMin * 60000;
  if (Math.abs(t - s.rise) <= win) return { periodo: "alba", sub: 1 };
  if (Math.abs(t - s.set) <= win) return { periodo: "cre", sub: 1 };
  if (t < s.rise || t > s.set) return { periodo: "noite", sub: null };
  const meio = (s.rise + s.set) / 2;
  const frac = 1 - Math.abs(t - meio) / (meio - s.rise); // 1 ao meio-dia, 0 na janela
  return { periodo: "dia", sub: null, meioFrac: clamp01(frac) };
}

// refNow permite calcular o modelo *à data de então*, para registar as

function computeAll(spot, shoreType, wx, sea, refNow) {
  const hours = buildHours(wx, sea);
  if (sea) shiftTide(hours, tideLagMin(spot.lat, spot.lon));
  const now = refNow ? new Date(refNow) : new Date();
  const nowIdx = Math.max(0, hours.findIndex((h) => new Date(h.t) > now) - 1);

  const reg = regionOf(spot.lat);

  const sstSeries = hours.map((h) => h.sst).filter((v) => v != null);
  const sstNow = (() => { for (let i = nowIdx; i >= 0; i--) if (hours[i].sst != null) return hours[i].sst; return null; })();
  const sstMean10 = sstSeries.length ? sstSeries.slice(0, Math.max(1, nowIdx)).reduce((a, b) => a + b, 0) / Math.max(1, Math.min(nowIdx, sstSeries.length)) : null;

  }

    const last24 = hours.slice(Math.max(0, nowIdx - 24), nowIdx + 1);
    const A = CFG.afloramento;
    const nort = last24.filter((h) => h.vento != null && h.vento >= A.ventoMin && h.dir != null && (h.dir >= A.dirLo || h.dir <= A.dirHi));
    const frac = last24.length ? nort.length / last24.length : 0;
    const meanV = nort.length ? nort.reduce((a, h) => a + h.vento, 0) / nort.length : 0;
    if (frac >= A.fracMin && meanV >= 20) {
      const d = sstNow - sst72;
      if (d <= A.strong.dSST) uplift = { mult: A.strong.mult, label: "afloramento forte (nortada + água a cair " + d.toFixed(1) + " °C)" };
      else if (d <= A.active.dSST) uplift = { mult: A.active.mult, label: "afloramento ativo (nortada + água mais fria)" };
      else if (d < 0.3) uplift = { mult: A.onset, label: "nortada persistente — afloramento a formar-se" };
    }
  }

  // espécies noturnas em época? (para a base da noite)
  const nocturnos = SPECIES.some((sp) => sp.diel.noite >= 0.9 && sp.pk.includes(mes) && sp.hab.includes(shoreType));

  function subsAt(i) {
    const h = hours[i];
    const subs = {};
    // MAR
    if (h.hs != null) {
      let m = trap(h.hs, CFG.hsTrap[shoreType]) * CFG.tpMult(h.tp);
      if (shoreType === "estuario") {
        const rain24 = hours.slice(Math.max(0, i - 24), i).reduce((a, x) => a + (x.chuva || 0), 0);
        if (rain24 > 30) m *= 0.8;

        if (on > 0) {

                             : 1 - CFG.vento.onshorePenalMax * on * clamp01((h.vento - 25) / 29);
        } else v *= 1 + 0.08 * (-on) * clamp01((h.vento - 11) / 22) * (h.vento < 43 ? 1 : 0.4);

      else level = 0.5;
      const fw = M.fw[shoreType];
      let mare = fw * flow + (1 - fw) * level;
      const rising = hours[i + 1].eta > hours[i - 1].eta;
      if (rising) mare *= M.floodMult[shoreType];
      else if (shoreType === "estuario") mare *= M.ebbMultEstuario;
      if (shoreType === "praia" && tmeta && tmeta.viva && lam < 0.15) mare *= M.deadLowSpringPenal;
      subs.mare = clamp01(mare);
    } else subs.mare = null;
    // LUZ
    const lp = luzPeriodo(h.t, suns);
    let luz;
    if (lp.periodo === "alba" || lp.periodo === "cre") luz = 1;
    else if (lp.periodo === "noite") {
      luz = nocturnos ? CFG.luz.noiteNocturnos : CFG.luz.noiteBase;
      if (moon.illum > 0.6) luz += CFG.luz.luarNudge;
    } else {
      const nub = (h.nuvens != null ? h.nuvens : 50) / 100;
      const meio = CFG.luz.diaMeioClaro + (CFG.luz.diaMeioNublado - CFG.luz.diaMeioClaro) * nub;
      luz = CFG.luz.diaOmbro + (meio - CFG.luz.diaOmbro) * (lp.meioFrac || 0);
    }
    subs.luz = clamp01(luz);
    // ÁGUA
    if (h.sst != null) {
      let a = interp(CFG.temp.any, h.sst);
      if (sstMean10 != null) a *= interp(CFG.aclim, h.sst - sstMean10);
      subs.agua = clamp01(a);
    } else subs.agua = null;
    // PRESSÃO
    const p24i = i - 24 >= 0 ? hours[i - 24].p : null, p3i = i - 3 >= 0 ? hours[i - 3].p : null;
    if (h.p != null && p24i != null) {
      const s24 = interp(CFG.pressao.d24, h.p - p24i);
      const s3 = p3i != null ? interp(CFG.pressao.d3, h.p - p3i) : 0.5;
      subs.pressao = 0.75 * s24 + 0.25 * s3;
    } else subs.pressao = null;
    return { subs, lp };
  }

  function safetyAt(i) {
    const h = hours[i];
    const S = CFG.seguranca;
    let lvl = 0;
    if (h.hs != null && h.tp != null) {
      const D = Math.sqrt(h.hs) * h.tp;
      lvl = Math.max(lvl, D >= S.dBands[2] ? 3 : D >= S.dBands[1] ? 2 : D >= S.dBands[0] ? 1 : 0);
    }
    if (h.hs != null) {
      const b = S.hsBands[shoreType];
      lvl = Math.max(lvl, h.hs >= b[2] ? 3 : h.hs >= b[1] ? 2 : h.hs >= b[0] ? 1 : 0);
    }
    if (h.tp != null && h.tp >= S.tpAmarelo) lvl = Math.max(lvl, 1);
    if (h.vento != null && h.vento > S.ventoLaranja) lvl = Math.max(lvl, 2);
    if (h.raj != null && h.raj >= S.rajadaVermelho) lvl = Math.max(lvl, 3);
    return lvl;
  }

  function scoreAt(i) {
    const { subs } = subsAt(i);
    let tot = 0, wsum = 0;
    for (const k of Object.keys(W)) {
      if (subs[k] != null) { tot += W[k] * subs[k]; wsum += W[k]; }
    }
    let score = wsum > 0 ? (tot / wsum) * 100 : 0;
    score *= uplift.mult;
    const lvl = safetyAt(i);
    score = Math.min(score * CFG.seguranca.mult[lvl], CFG.seguranca.caps[lvl]);
    return { score: Math.round(clamp(score, 0, 100)), subs, lvl };
  }

  // série de 48h a partir de agora + semana (7 dias, melhor hora 06-24)
  const start = nowIdx;
  const hoje = hours[start].t.slice(0, 10);
  const s48 = [];
  for (let i = start; i < Math.min(hours.length, start + 48); i++) s48.push({ i, t: hours[i].t, ...scoreAt(i) });
  const week = [];
  wx.daily.time.forEach((d) => {
    if (d < hoje) return;
    let best = 0;
    for (let i = start; i < hours.length; i++) {
      if (hours[i].t.slice(0, 10) !== d) continue;
      const hh = +hours[i].t.slice(11, 13);
      if (hh >= 6) best = Math.max(best, scoreAt(i).score);
    }
    week.push({ d, label: diaLabel(d, hoje), score: best });
  });

  // janelas nas próximas 48h
  const best = Math.max.apply(null, s48.map((x) => x.score));
  const lim = Math.max(CFG.janelas.limiar, best - CFG.janelas.folga);
  const runs = [];
  let cur = null;
  for (const x of s48) {
    if (x.score >= lim) { if (!cur) { cur = []; runs.push(cur); } cur.push(x); }
    else cur = null;
  }
  const MAXW = CFG.janelas.maxHoras;
  const trimmed = runs.map((r) => {
    if (r.length <= MAXW) return r;
    let bi = 0, bs = -1; // sub-bloco de MAXW horas com melhor soma
    for (let i = 0; i + MAXW <= r.length; i++) {
      const s = r.slice(i, i + MAXW).reduce((a, x) => a + x.score, 0);
      if (s > bs) { bs = s; bi = i; }
    }
    return r.slice(bi, bi + MAXW);
  });
  const runMax = (r) => Math.max.apply(null, r.map((x) => x.score));
  trimmed.sort((a, b) => runMax(b) - runMax(a));
  const hh = (d) => String(d.getHours()).padStart(2, "0") + "h";
  const windows = trimmed.slice(0, 3).map((r) => {
    const a = r[0], b = r[r.length - 1];
    const iMid = r[Math.floor(r.length / 2)].i;
    const { subs, lp } = subsAt(iMid);
    let tagMare = "";
    if (subs.mare != null && hours[iMid + 1] && hours[iMid - 1] && hours[iMid + 1].eta != null)
      tagMare = hours[iMid + 1].eta > hours[iMid - 1].eta ? "Enchente" : "Vazante";
    const tagLuz = lp.periodo === "alba" ? "nascer do sol" : lp.periodo === "cre" ? "pôr-do-sol" : lp.periodo === "noite" ? "noite" : "dia";
    const ini = new Date(a.t);
    const fim = new Date(new Date(b.t).getTime() + 3600000); // a hora "b" conta inteira
    const diaIni = diaLabel(a.t.slice(0, 10), hoje);
    // fim às 00:00 ainda pertence, visualmente, ao dia que começou
    const atravessa = fim.getHours() !== 0 && fim.toDateString() !== ini.toDateString();
    const diaFim = atravessa ? diaLabel(ymd(fim), hoje) : null;
    return {
      when: atravessa
        ? diaIni + " " + hh(ini) + " → " + diaFim + " " + hh(fim)
        : diaIni + ", " + hh(ini) + "–" + (fim.getHours() === 0 ? "00h" : hh(fim)),
      tag: [tagMare, tagLuz].filter(Boolean).join(" + ") || "condições estáveis",
      score: runMax(r),
    };
  });

  // espécies (condições atuais)
  const nowSub = subsAt(start);
  const periodo = nowSub.lp.periodo;
  const dielKey = periodo === "alba" ? "alba" : periodo === "cre" ? "cre" : periodo === "noite" ? "noite" : "dia";
  const hsNow = hours[start].hs;
  const ranked = SPECIES.map((sp) => {
    const season = sp.pk.includes(mes) ? 1 : sp.ok.includes(mes) ? 0.55 : 0.08;
    const hab = sp.hab.includes(shoreType) ? 1 : 0.15;
    const diel = sp.diel[dielKey];
    let wfit = 1;
    if (hsNow != null && sp.w) wfit = trap(hsNow, [Math.max(0, sp.w[0] - 0.3), sp.w[0], sp.w[1], sp.w[1] + 1.2]) * 0.7 + 0.3;
    let tfit = 1;
    if (sstNow != null) {
      const c = CFG.temp[sp.curve] || CFG.temp.any;
      tfit = interp(c, sp.cold ? sstNow + 3 : sstNow) * 0.7 + 0.3;
    }
    // `val` < 1 para espécies que pescam sempre mas ninguém procura (boga),
    // para não empurrarem robalo/sargo para fora da lista
    return { sp, suit: season * (sp.reg[reg] || 0.5) * hab * diel * wfit * tfit * (sp.val || 1) };
  }).filter((x) => x.suit > 0.12).sort((a, b) => b.suit - a.suit).slice(0, 5);

  // técnica
  const ventoNow = hours[start].vento || 0;
  const nowScore = scoreAt(start);
  let tech;
  if (nowScore.lvl >= 3) tech = { name: "NÃO VALE A PENA", icon: "🛑", why: "Mar perigoso — hoje não é dia de pesca. Vê as próximas janelas em baixo." , tips: [] };
  else {
    const boiaOk = (hsNow == null || hsNow < 1.1) && ventoNow < 22 && shoreType !== "praia" &&
      ranked.some((r) => r.sp.tec.includes("boia"));
    const gr = Math.min(150, Math.round((80 + 30 * (hsNow || 0.5) + (ventoNow > 25 ? 20 : 0)) / 10) * 10);
    const top = ranked[0] ? ranked[0].sp : null;
    if (boiaOk && top && top.tec[0] === "boia") {
      tech = { name: "BOIA", icon: "🎈",
        why: "Mar calmo e pouco vento junto a estrutura — condições ideais para pescar à boia.",
        tips: [
          "<b>Montagem:</b> boia corrida, chumbos pequenos, anzol n.º 4-8 num estralho de 0.20-0.25 mm.",
          "<b>Profundidade:</b> começa com o isco ~0.5 m acima do fundo e vai subindo se não houver toques.",
          top ? "<b>Isco para " + top.n.toLowerCase() + ":</b> " + top.isco + "." : "",
          top ? "<b>Onde:</b> " + top.zona + "." : "",
        ].filter(Boolean) };
    } else {
      tech = { name: "CHUMBADA (fundo)", icon: "⚓",
        why: (hsNow != null && hsNow >= 1.1 ? "Com este mar, o fundo é mais eficaz e seguro do que a boia." : "Pesca de fundo é a aposta mais fiável nestas condições."),
        tips: [
          "<b>Montagem:</b> paternoster de 2 anzóis (n.º 2-4) ou montagem corrida; chumbada de <b>" + gr + " g</b> para este vento/mar.",
          "<b>Lançamento:</b> não precisas de força — atrás da 1.ª rebentação (30-60 m) já há peixe.",
          ranked[0] ? "<b>Isco para " + ranked[0].sp.n.toLowerCase() + ":</b> " + ranked[0].sp.isco + "." : "",
          ranked[0] ? "<b>Onde:</b> " + ranked[0].sp.zona + "." : "",
        ].filter(Boolean) };
    }
    if (shoreType === "paredao" && ranked.some((r) => ["carapau", "cavala"].includes(r.sp.id)) && (dielKey === "cre" || dielKey === "noite"))
      tech.tips.push("<b>Alternativa fácil:</b> sabiki (penas) a meia-água para carapau/cavala — quase não falha ao fim do dia no molhe.");
  }

  // segurança (texto)
  const lvlNow = Math.max.apply(null, s48.slice(0, 12).map((x) => x.lvl));
  let safety = null;
  if (lvlNow >= 1 && hsNow != null) {
    const freak = (1.9 * hsNow).toFixed(1);
    const nomes = ["", "amarelo", "laranja", "vermelho"];
    let txt = "Ondulação " + hsNow.toFixed(1) + " m" + (hours[start].tp ? " com período " + Math.round(hours[start].tp) + " s" : "") +
      ". Espera ondas isoladas até ≈" + freak + " m. ";
    if (lvlNow >= 3) txt += "NÃO vás para rochas, molhes ou zonas expostas — risco de vida. Com aviso IPMA ativo, a pesca nos molhes é proibida por edital.";
    else if (lvlNow === 2) txt += "Rochas e paredão não recomendados. Se fores ao areal, fica bem recuado da água.";
    else txt += "Cuidado redobrado em rochas e molhes: nunca vires costas ao mar e observa o mar 10 min antes de te aproximares.";
    safety = { nivel: nomes[lvlNow], lvl: lvlNow, text: txt };
  }

  // série + extremos para o gráfico de maré (próximas 48h)
  const end48 = new Date(now.getTime() + 48 * 3600000);
  const tideSeries = sea ? hours.slice(start, start + 49).filter((h) => h.eta != null).map((h) => ({ t: h.t, eta: h.eta })) : [];
  const tideMarks = ext.filter((e) => e.when >= new Date(hours[start].t) && e.when <= end48)
    .map((e) => ({ tipo: e.tipo, ms: e.when.getTime(), eta: e.eta, hm: e.when.toTimeString().slice(0, 5) }));

  // maré p/ UI
  const futureExt = ext.filter((e) => e.when > now).slice(0, 2);
  const tide = {
    high: "—", low: "—", highSub: "", lowSub: "", noData: !sea,
    viva: tmeta ? (tmeta.viva ? "Marés vivas" : tmeta.morta ? "Marés mortas" : "Coeficiente médio") : "",
  };
  for (const e of futureExt) {
    const s = e.when.toTimeString().slice(0, 5);
    const dia = diaLabel(ymd(e.when), hoje);
    if (e.tipo === "alta" && tide.high === "—") { tide.high = s; tide.highSub = dia; }
    if (e.tipo === "baixa" && tide.low === "—") { tide.low = s; tide.lowSub = dia; }
  }
  // se só apanhámos um tipo nos próximos 2, procurar o outro
  for (const e of ext.filter((x) => x.when > now).slice(0, 5)) {
    const s = e.when.toTimeString().slice(0, 5);
    const dia = diaLabel(ymd(e.when), hoje);
    if (e.tipo === "alta" && tide.high === "—") { tide.high = s; tide.highSub = dia; }
    if (e.tipo === "baixa" && tide.low === "—") { tide.low = s; tide.lowSub = dia; }
  }

  // fatores para a UI
  const S = nowSub.subs;
  const fnote = {
    mar: hsNow == null ? "Sem dados de mar para este ponto." :
      hsNow < 0.3 ? "Mar muito calmo (" + hsNow.toFixed(1) + " m) — água limpa, peixe desconfiado." :
      hsNow <= 1.2 ? "Ondulação de " + hsNow.toFixed(1) + " m — ideal, mexe o fundo sem impedir a pesca." :
      hsNow <= 2.2 ? "Ondulação de " + hsNow.toFixed(1) + " m — já difícil; pesa mais a segurança." :
      "Mar grande (" + hsNow.toFixed(1) + " m) — praticamente impescável.",
    vento: hours[start].vento == null ? "Sem dados de vento." :
      Math.round(hours[start].vento) + " km/h" + (hours[start].raj ? " (rajadas " + Math.round(hours[start].raj) + ")" : "") +
      (Math.cos(((hours[start].dir || 0) - sd) * Math.PI / 180) > 0.3 ? ", do mar." : Math.cos(((hours[start].dir || 0) - sd) * Math.PI / 180) < -0.3 ? ", de terra (bom para lançar)." : "."),
    mare: !sea ? "Sem dados de maré." : (tide.viva ? tide.viva + ". " : "") + "O peixe come com a água a mexer — pior na estofa.",
    luz: dielKey === "alba" ? "Nascer do sol — a melhor luz do dia." : dielKey === "cre" ? "Pôr-do-sol — a melhor luz do dia." :
      dielKey === "noite" ? (nocturnos ? "Noite — boa: há espécies noturnas na época." : "Noite — razoável.") :
      "Dia claro — o peixe desconfia; melhor perto do nascer/pôr-do-sol.",
    agua: sstNow == null ? "Sem temperatura da água." :
      "Água a " + sstNow.toFixed(1) + " °C" + (uplift.label ? " — " + uplift.label + "." : (sstMean10 != null && sstNow - sstMean10 < -1.5 ? " — a arrefecer depressa, o peixe ressente-se." : ".")),
    pressao: S.pressao == null ? "Sem dados de pressão." :
      (hours[start].p && hours[start - 24] && hours[start - 24].p ? (hours[start].p - hours[start - 24].p).toFixed(1) + " hPa/24h. " : "") +
      "Efeito pequeno — os estudos mostram que pesa pouco.",
  };
  const factors = [
    { key: "mar", label: "Estado do mar", icon: "🌊", value: S.mar == null ? null : Math.round(S.mar * 100), note: fnote.mar },
    { key: "mare", label: "Maré", icon: "🌊", value: S.mare == null ? null : Math.round(S.mare * 100), note: fnote.mare },
    { key: "luz", label: "Luz / período do dia", icon: "🌅", value: Math.round(S.luz * 100), note: fnote.luz },
    { key: "vento", label: "Vento", icon: "💨", value: S.vento == null ? null : Math.round(S.vento * 100), note: fnote.vento },
    { key: "agua", label: "Água (temperatura)", icon: "🌡️", value: S.agua == null ? null : Math.round(S.agua * 100), note: fnote.agua },
    { key: "pressao", label: "Pressão", icon: "📈", value: S.pressao == null ? null : Math.round(S.pressao * 100), note: fnote.pressao },
    { key: "lua", label: "Lua", icon: "🌙", value: null, info: true,
      note: moon.label + " (" + Math.round(moon.illum * 100) + "%). Não pontua à parte: o efeito real entra pelas marés " + (tmeta && tmeta.viva ? "vivas" : tmeta && tmeta.morta ? "mortas" : "") + " e pelo luar à noite." },
  ];

  const partial = !sea;
  return {
    score: nowScore.score, partial, safety, windows,
    forecast: s48.map((x) => ({ s: x.score, t: x.t })), week, factors, tech,
    species: ranked.map((r) => ({ n: r.sp.n, min: r.sp.min })),
    tide, uplift, moon, tideSeries, tideMarks,
    horaRef: (() => { const c = hours[start] || {}; return { t: c.t, hs: c.hs, tp: c.tp, vento: c.vento,
      rajada: c.raj, dirVento: c.dir, sst: c.sst, nuvens: c.nuvens, pressao: c.p }; })(),
    updatedAt: "hoje às " + now.toTimeString().slice(0, 5),
  };
}

/* ---------- score de albufeira ---------- */
function computeDoce(spot, wx, nivel, refNow) {
  const D = CFG.doce, P = D.pesos;
  const hours = buildHours(wx, null);
  const now = refNow ? new Date(refNow) : new Date();
  const start = Math.max(0, hours.findIndex((h) => new Date(h.t) > now) - 1);
  const suns = makeSuns(wx);
  const mes = now.getMonth() + 1, dia = now.getDate();
  const funda = !!spot.funda;
  const tw = tempAgua(hours, start);
  const frio = !!spot.frio;

  // espécies em época e possíveis nesta albufeira
  const emEpoca = ESPECIES_DOCE.filter((sp) =>
    sp.ok.includes(mes) && !noDefeso(sp, mes, dia) && (frio ? sp.frio > 0.3 : sp.frio < 1));
  const noturnas = emEpoca.some((sp) => sp.noturna);

  const nivelTendVal = nivel && nivel.tendenciaCotaSemana != null ? nivel.tendenciaCotaSemana : null;
  const subNivelTend = nivelTendVal == null ? null
    : nivelTendVal >= D.limiarTendencia ? D.nivelTend.sobeMuito
    : nivelTendVal >= 0.05 ? D.nivelTend.sobe
    : nivelTendVal > -0.05 ? D.nivelTend.estavel
    : nivelTendVal > -D.limiarTendencia ? D.nivelTend.desce : D.nivelTend.desceMuito;

  function subsAt(i) {
    const h = hours[i], s = {};
    const alt = anguloSolar(new Date(h.t), spot.lat, spot.lon);
    // ÁGUA — o factor dominante; melhor espécie em época manda
    if (tw) {
      let melhor = 0;
      for (const sp of emEpoca) melhor = Math.max(melhor, interp(D.temp[sp.curva] || D.temp.any, tw.agora));
      s.agua = clamp01(melhor || interp(D.temp.any, tw.agora));
      s.aguaTend = clamp01(tw.agora < 20 ? (tw.tend3d >= 1.5 ? 1 : tw.tend3d <= -2 ? 0.2 : 0.6 + tw.tend3d * 0.2)
                                         : (tw.tend3d <= -1.5 ? 1 : tw.tend3d >= 1.5 ? 0.35 : 0.6 - tw.tend3d * 0.15));
    } else { s.agua = null; s.aguaTend = null; }
    // LUZ — pelo ângulo solar
    s.luz = alt < -6 ? (noturnas ? D.luz.noiteNoturnas : D.luz.noite)
          : alt <= 10 ? D.luz.crepusculo : alt <= 25 ? D.luz.medio : D.luz.alto;
    // ÉPOCA — média da adequação das espécies em época
    s.epoca = emEpoca.length
      ? clamp01(emEpoca.reduce((a, sp) => a + (sp.pk.includes(mes) ? 1 : 0.55), 0) / emEpoca.length) : 0.3;
    s.vento = h.vento == null ? null : clamp01(interp(D.vento, h.vento));
    s.nuvens = alt < 0 ? 1 : (h.nuvens == null ? null : clamp01(interp(D.nuvens, h.nuvens)));
    s.nivel = null; // % de enchimento exige capacidade total — ver README
    s.nivelTend = subNivelTend;
    s.turbidez = null;                       // sem fonte gratuita
    s.estrat = (funda && tw && tw.agora > 26 && alt > 10) ? 0.85 : 1;
    const chuva24 = hours.slice(Math.max(0, i - 24), i).reduce((a, x) => a + (x.chuva || 0), 0);
    s.chuva = chuva24 > 25 ? 0.6 : chuva24 > 8 ? 0.85 : 1;
    return { s, alt };
  }
  function scoreAt(i) {
    const { s } = subsAt(i);
    let tot = 0, w = 0;
    for (const k of Object.keys(P)) if (s[k] != null) { tot += P[k] * s[k]; w += P[k]; }
    const bruto = w ? tot / w : 0;
    const [lo, hi] = D.compressao;
    return { score: Math.round(lo + bruto * (hi - lo)), subs: s };
  }

  const s48 = [];
  for (let i = start; i < Math.min(hours.length, start + 48); i++) s48.push({ i, t: hours[i].t, ...scoreAt(i) });
  const hoje = hours[start].t.slice(0, 10);
  const week = [];
  wx.daily.time.forEach((d) => {
    if (d < hoje) return;
    let best = 0;
    for (let i = start; i < hours.length; i++) if (hours[i].t.slice(0, 10) === d) best = Math.max(best, scoreAt(i).score);
    week.push({ d, label: diaLabel(d, hoje), score: best });
  });

  // janelas (respeitando a proibição de pesca nocturna)
  const best = Math.max.apply(null, s48.map((x) => x.score));
  const lim = Math.max(CFG.janelas.limiar, best - CFG.janelas.folga);
  const runs = []; let cur = null;
  for (const x of s48) { if (x.score >= lim) { if (!cur) { cur = []; runs.push(cur); } cur.push(x); } else cur = null; }
  const MAXW = CFG.janelas.maxHoras;
  const trim = runs.map((r) => {
    if (r.length <= MAXW) return r;
    let bi = 0, bs = -1;
    for (let k = 0; k + MAXW <= r.length; k++) {
      const sm = r.slice(k, k + MAXW).reduce((a, x) => a + x.score, 0);
      if (sm > bs) { bs = sm; bi = k; }
    }
    return r.slice(bi, bi + MAXW);
  });
  const rmax = (r) => Math.max.apply(null, r.map((x) => x.score));
  trim.sort((a, b) => rmax(b) - rmax(a));
  const hh = (d) => String(d.getHours()).padStart(2, "0") + "h";
  const windows = trim.slice(0, 3).map((r) => {
    const a = r[0], b = r[r.length - 1];
    const ini = new Date(a.t), fim = new Date(new Date(b.t).getTime() + 36e5);
    const diaIni = diaLabel(a.t.slice(0, 10), hoje);
    const atravessa = fim.getHours() !== 0 && fim.toDateString() !== ini.toDateString();
    const altMid = anguloSolar(new Date(r[Math.floor(r.length / 2)].t), spot.lat, spot.lon);
    return {
      when: atravessa ? diaIni + " " + hh(ini) + " → " + diaLabel(ymd(fim), hoje) + " " + hh(fim)
                      : diaIni + ", " + hh(ini) + "–" + (fim.getHours() === 0 ? "00h" : hh(fim)),
      tag: altMid < -6 ? "noite — precisa de autorização" : altMid <= 10 ? "crepúsculo, a melhor luz" : "dia",
      score: rmax(r), noturna: altMid < -6,
    };
  });

  const agora = scoreAt(start);
  const ranked = emEpoca.map((sp) => {
    const diel = anguloSolar(now, spot.lat, spot.lon) < -6 ? sp.diel.noite : sp.diel.dia;
    const tfit = tw ? interp(D.temp[sp.curva] || D.temp.any, tw.agora) : 0.6;
    const rfit = frio ? sp.frio : (1 - sp.frio * 0.3);
    return { sp, suit: (sp.pk.includes(mes) ? 1 : 0.55) * diel * tfit * rfit };
  }).sort((a, b) => b.suit - a.suit).slice(0, 5);

  const top = ranked[0] ? ranked[0].sp : null;
  const tech = top ? {
    name: top.tec || (top.id === "achiga" || top.id === "lucioperca" ? "AMOSTRAS (spinning)" : "FUNDO / BOIA"),
    icon: top.id === "achiga" || top.id === "lucioperca" ? "🎣" : "⚓",
    why: "Melhor aposta agora: " + top.n.toLowerCase() + ".",
    tips: [
      "<b>Isco:</b> " + top.isco + ".",
      "<b>Onde:</b> " + top.zona + ".",
      tw ? "<b>Água estimada:</b> " + tw.agora.toFixed(1) + " °C (calculada a partir do ar, ±1-2 °C)." : "",
      "<b>Licença:</b> pesca lúdica em águas interiores (ICNF) — é diferente da do mar.",
    ].filter(Boolean),
  } : { name: "—", icon: "🎣", why: "Sem espécies em época.", tips: [] };

  const nivelTxt = nivel && nivel.cota
    ? "Cota " + nivel.cota.valor.toFixed(2) + " m" +
      (nivelTendVal != null ? (nivelTendVal > 0.05 ? " · a subir " + nivelTendVal.toFixed(2) + " m/semana"
        : nivelTendVal < -0.05 ? " · a descer " + Math.abs(nivelTendVal).toFixed(2) + " m/semana" : " · estável") : "")
    : "Sem dados de nível";

  const factors = [
    { key:"agua", label:"Temperatura da água", icon:"🌡️", value: agora.subs.agua == null ? null : Math.round(agora.subs.agua * 100),
      note: tw ? "≈" + tw.agora.toFixed(1) + " °C, estimada do ar (±1-2 °C). É o factor que mais pesa em água doce." : "Sem estimativa." },
    { key:"luz", label:"Luz / período do dia", icon:"🌅", value: Math.round(agora.subs.luz * 100),
      note: "O crepúsculo é o pico documentado. A pesca nocturna é proibida sem autorização." },
    { key:"nivelTend", label:"Nível da albufeira", icon:"💧", value: subNivelTend == null ? null : Math.round(subNivelTend * 100),
      note: nivelTxt + ". Água a subir inunda o mato e traz o peixe à margem." },
    { key:"epoca", label:"Época", icon:"📅", value: Math.round(agora.subs.epoca * 100),
      note: emEpoca.length ? emEpoca.length + " espécies em época este mês." : "Poucas espécies em época." },
    { key:"vento", label:"Vento", icon:"💨", value: agora.subs.vento == null ? null : Math.round(agora.subs.vento * 100),
      note: hours[start].vento == null ? "Sem dados." : Math.round(hours[start].vento) + " km/h. Alguma ondulação ajuda; muito vento impede lançar." },
    { key:"nuvens", label:"Nebulosidade", icon:"☁️", value: agora.subs.nuvens == null ? null : Math.round(agora.subs.nuvens * 100),
      note: "Céu encoberto melhora — menos luz no fundo." },
    { key:"pressao", label:"Pressão", icon:"📈", value: null, info: true,
      note: "Não pontua: o melhor estudo (4.776 saídas, 13 anos) não encontrou efeito nenhum, e o estudo que toda a gente cita não existe." },
    { key:"lua", label:"Lua", icon:"🌙", value: null, info: true,
      note: "Não pontua: sem marés não há por onde o efeito chegar, e as tabelas solunares falharam a validação." },
  ];

  return {
    doce: true, score: agora.score, partial: !nivel, safety: null,
    windows, forecast: s48.map((x) => ({ s: x.score, t: x.t })), week, factors, tech,
    species: ranked.map((r) => ({ n: r.sp.n, min: r.sp.min, dev: r.sp.dev })),
    tide: { noData: true, high: "—", low: "—", viva: "" },
    tideSeries: [], tideMarks: [], moon: moonInfo(now), uplift: { mult: 1, label: null },
    nivel, nivelTxt, tempAgua: tw ? tw.agora : null, noturnas,
    horaRef: (() => { const c = hours[start] || {}; return { t: c.t, vento: c.vento, rajada: c.raj,
      dirVento: c.dir, nuvens: c.nuvens, pressao: c.p, tempAr: c.temp, tempAgua: tw ? tw.agora : null }; })(),
    updatedAt: "hoje às " + now.toTimeString().slice(0, 5),
  };
}

/* ====================== REGISTO DE PESCARIAS ======================
   localStorage por agora. O formato já é o de um backend partilhado:
   cada registo tem id próprio e id de pescador, para se poderem juntar
   exportações de várias pessoas sem colisões nem duplicados.        */
const LOG_KEY = "pesca:log", ANGLER_KEY = "pesca:angler", LOG_V = 1;
function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "x" + Date.now().toString(36) + Math.floor(Math.random() * 1e9).toString(36);
}
function anglerId() {
  let a = null;
  try { a = localStorage.getItem(ANGLER_KEY); } catch (e) {}
  if (!a) { a = uid(); try { localStorage.setItem(ANGLER_KEY, a); } catch (e) {} }
  return a;
}
function readLog() {
  try { const l = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); return Array.isArray(l) ? l : []; }
  catch (e) { return []; }
}
function writeLog(l) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); return true; }
  catch (e) { alert("Não foi possível guardar (armazenamento cheio?)."); return false; }
}
// Retrato das condições — é isto que permitirá verificar se o score bate certo.
function condDoVm(vm, quando) {
  if (!vm) return null;
  const f = {};
  vm.factors.forEach((x) => { f[x.key] = x.value; });
  const c = vm.horaRef || {};
  return { score: vm.score, parcial: !!vm.partial, sub: f, lua: Math.round(vm.moon.illum * 100),
    hs: c.hs, tp: c.tp, vento: c.vento, rajada: c.rajada, dirVento: c.dirVento, sst: c.sst,
    nuvens: c.nuvens, pressao: c.pressao, mareAlta: vm.tide.high, mareBaixa: vm.tide.low,
    mareTipo: vm.tide.viva, horaModelo: c.t, obtidoEm: new Date().toISOString(),
    afloramento: vm.uplift && vm.uplift.label ? vm.uplift.label : null };
}
// Condições da data e do local da pescaria — não as de agora. É o que
// distingue um registo útil de um registo inútil.
function condParaSessao(spot, shoreType, inicioISO, horas) {
  const ini = new Date(inicioISO);
  const meio = new Date(ini.getTime() + (horas / 2) * 3600000);
  const dias = Math.floor((Date.now() - meio.getTime()) / 86400000);
  if (dias < 0) return Promise.resolve(null);
  if (dias > 88) return Promise.resolve({ foraDeAlcance: true }); // limite do past_days
  if (spot.lat == null || spot.lon == null) return Promise.resolve(null);
  // Sempre com pedido próprio: reutilizar os dados já carregados parecia
  // uma optimização óbvia, mas eles só têm 1 dia de passado e a tendência
  // de pressão precisa de 24h antes da sessão — dava pressão nula.
  const past = clamp(dias + 3, 3, 92);
  return Promise.allSettled([fetchWx(spot.lat, spot.lon, past), fetchSea(spot.lat, spot.lon, 0, past)])
    .then(([w, s]) => {
      if (w.status !== "fulfilled") return null;
      const sea = s.status === "fulfilled" ? s.value : null;
      try { return condDoVm(computeAll(spot, shoreType, w.value, sea, meio), meio); }
      catch (e) { return null; }
    });
}
function addSession(s) {
  const l = readLog();
  l.push(s);
  l.sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
  writeLog(l);
}
function exportLog() {
  const data = { formato: "pesca-score-log", versao: LOG_V, exportadoEm: new Date().toISOString(),
    pescador: anglerId(), sessoes: readLog() };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "pescarias-" + ymd(new Date()) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importLog(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(fr.result); } catch (e) { alert("Ficheiro inválido."); return; }
    const novas = Array.isArray(d) ? d : (d && d.sessoes);
    if (!Array.isArray(novas)) { alert("Ficheiro sem sessões."); return; }
    const l = readLog(), ids = new Set(l.map((s) => s.id));
    let n = 0;
    novas.forEach((s) => { if (s && s.id && !ids.has(s.id)) { l.push(s); ids.add(s.id); n++; } });
    l.sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
    writeLog(l);
    alert(n ? "Importadas " + n + " pescarias." : "Nada de novo para importar (já lá estavam).");
    render();
  };
  fr.readAsText(file);
}
// Peixes por hora-pescador, por faixa de score — o teste de que o score presta.
// O esforço tem de contar as pessoas: 3 pescadores × 3h = 9 horas de pesca,
// não 3. Sem isso, uma saída em grupo parece milagrosa.
function logStats() {
  const l = readLog().filter((s) => s.cond && s.cond.score != null && s.horas > 0);
  if (l.length < 3) return null;
  const faixas = [[85, 100, "85-100 Excelente"], [65, 84, "65-84 Bom"], [45, 64, "45-64 Razoável"], [0, 44, "0-44 Fraco"]];
  const linhas = faixas.map(([lo, hi, nome]) => {
    const g = l.filter((s) => s.cond.score >= lo && s.cond.score <= hi);
    const horas = g.reduce((a, s) => a + s.horas * (s.pescadores || 1), 0);
    const peixes = g.reduce((a, s) => a + (s.capturas || []).reduce((b, c) => b + (+c.n || 0), 0), 0);
    return { nome, n: g.length, horas, cpue: horas > 0 ? peixes / horas : null };
  }).filter((x) => x.n > 0);
  return { linhas, total: l.length };
}

/* ============================ VIEW ============================ */
const app = document.getElementById("app");
const st = {
  spot: null, shoreType: "praia", vm: null, loading: false, error: null,
  results: null, query: "", factorsOpen: false, mapExpanded: false, windowsView: "48h", offline: false,
  mapLayer: (function () { try { return localStorage.getItem("pesca:layer") || "mapa"; } catch (e) { return "mapa"; } })(),
  geoBusy: false,
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && st.mapExpanded) { st.mapExpanded = false; render(); }
});
function verdictFor(score) {
  if (score >= 85) return { label: "Excelente", css: "var(--v-excelente)" };
  if (score >= 65) return { label: "Bom", css: "var(--v-bom)" };
  if (score >= 45) return { label: "Razoável", css: "var(--v-razoavel)" };
  if (score >= 25) return { label: "Fraco", css: "var(--v-fraco)" };
  return { label: "Não vale a pena", css: "var(--v-naovale)" };
}
const TIPOS = [["praia", "Areal"], ["rochas", "Rochas"], ["paredao", "Paredão"], ["estuario", "Ria/estuário"], ["albufeira", "Albufeira"]];
const TIPO_LABEL = { praia: "Areal", rochas: "Rochas", paredao: "Paredão", estuario: "Ria/estuário", albufeira: "Albufeira" };
const distKm = (aLat, aLon, bLat, bLon) => Math.hypot((aLat - bLat) * 111, (aLon - bLon) * 111 * Math.cos(aLat * Math.PI / 180));
function nearestSpot(lat, lon) {
  let best = null, bd = 1e9;
  for (const s of SPOTS) { const d = distKm(lat, lon, s[1], s[2]); if (d < bd) { bd = d; best = s; } }
  let melhor = { spot: { name: best[0], lat: best[1], lon: best[2], tipo: best[3] }, km: bd };
  for (const a of ALBUFEIRAS) {
    const d = distKm(lat, lon, a[1], a[2]);
    if (d < melhor.km) melhor = { spot: { name: "Barragem de " + a[0], lat: a[1], lon: a[2], tipo: "albufeira" }, km: d };
  }
  return melhor;
}

/* --- Leaflet: mapa real, tiles sem chave (mapa OSM/CARTO + satélite Esri) --- */
let LMAP = null, LSPOTS = null, LTILE = null;
const spotScores = {}; // "lat,lon" → score (cache da sessão)
const spotKey = (lat, lon) => lat.toFixed(3) + "," + lon.toFixed(3);
const VERDICT_HEX = [[85, "#3fcf7a"], [65, "#7fd44f"], [45, "#e8c33a"], [25, "#f08b3c"], [0, "#e2544a"]];
const hexFor = (s) => (VERDICT_HEX.find((v) => s >= v[0]) || VERDICT_HEX[4])[1];

function tileLayerFor(kind) {
  if (kind === "satelite") {
    return L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 18, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" });
  }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  return L.tileLayer(
    dark ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
         : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    { maxZoom: 18, subdomains: "abcd", attribution: "&copy; OpenStreetMap &copy; CARTO" });
}
function setMapLayer(kind) {
  st.mapLayer = kind;
  try { localStorage.setItem("pesca:layer", kind); } catch (e) {}
  if (!LMAP) return;
  if (LTILE) LTILE.remove();
  LTILE = tileLayerFor(kind).addTo(LMAP);
  document.querySelectorAll("#mapLayers button").forEach((b) => b.classList.toggle("active", b.getAttribute("data-layer") === kind));
}
function badgeIcon(spot, score, selected) {
  const known = score != null;
  const style = known ? `background:${hexFor(score)}` : "";
  return L.divIcon({
    className: "", iconSize: null, iconAnchor: [22, 15],
    html: `<span class="spot-badge${known ? "" : " pending"}${selected ? " sel" : ""}" style="${style}">${known ? score : "·"}</span>`,
  });
}
/* Ponto azul "estás aqui" + círculo de precisão */
let LUSER = null;
function drawUser() {
  if (!LMAP) return;
  if (LUSER) { LUSER.remove(); LUSER = null; }
  if (!st.userPos) return;
  const { lat, lon, acc } = st.userPos;
  LUSER = L.layerGroup().addTo(LMAP);
  if (acc && acc > 25) {
    L.circle([lat, lon], { radius: acc, color: "#1f8fff", weight: 1, opacity: 0.5, fillColor: "#1f8fff", fillOpacity: 0.10, interactive: false }).addTo(LUSER);
  }
  L.marker([lat, lon], {
    icon: L.divIcon({ className: "", iconSize: [16, 16], iconAnchor: [8, 8], html: '<span class="user-dot"></span>' }),
    zIndexOffset: 2000,
  }).bindTooltip("Estás aqui" + (acc ? " (±" + Math.round(acc) + " m)" : ""), { direction: "top", offset: [0, -10] }).addTo(LUSER);
}
function drawSpots() {
  if (!LMAP || !LSPOTS) return;
  LSPOTS.clearLayers();
  const sel = st.spot ? spotKey(st.spot.lat, st.spot.lon) : null;
  const list = SPOTS.concat(ALBUFEIRAS.map((a) => ["Barragem de " + a[0], a[1], a[2], "albufeira"]));
  // ponto livre (fora da lista curada) também ganha marcador
  if (st.spot && !SPOTS.some((s) => spotKey(s[1], s[2]) === sel)) list.push([st.spot.name, st.spot.lat, st.spot.lon, st.shoreType]);
  list.forEach((s) => {
    const k = spotKey(s[1], s[2]);
    const isSel = k === sel;
    const sc = isSel && st.vm ? st.vm.score : spotScores[k];
    L.marker([s[1], s[2]], { icon: badgeIcon(s, sc == null ? null : sc, isSel), riseOnHover: true, zIndexOffset: isSel ? 1000 : 0 })
      .bindTooltip(s[0] + " · " + TIPO_LABEL[s[3]] + (sc != null ? " · " + sc + "/100" : ""), { direction: "top", offset: [0, -12] })
      .on("click", (e) => { L.DomEvent.stop(e); selectSpot({ name: s[0], lat: s[1], lon: s[2], tipo: s[3] }); })
      .addTo(LSPOTS);
  });
}
/* Scores de todos os pesqueiros visíveis — 2 pedidos em lote (multi-coordenada) */
let bulkT = null;
function loadVisibleScores() {
  if (!LMAP) return;
  clearTimeout(bulkT);
  bulkT = setTimeout(() => {
    const b = LMAP.getBounds();
    const pend = SPOTS.filter((s) => b.contains([s[1], s[2]]) && spotScores[spotKey(s[1], s[2])] === undefined).slice(0, 30);
    if (!pend.length) return;
    pend.forEach((s) => { spotScores[spotKey(s[1], s[2])] = null; }); // marca "em curso"
    const lats = pend.map((s) => s[1]).join(","), lons = pend.map((s) => s[2]).join(",");
    const fUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + lats + "&longitude=" + lons +
      "&hourly=pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation" +
      "&daily=sunrise,sunset&timezone=Europe%2FLisbon&past_days=2&forecast_days=2&wind_speed_unit=kmh";
    const mUrl = "https://marine-api.open-meteo.com/v1/marine?latitude=" + lats + "&longitude=" + lons +
      "&hourly=wave_height,wave_period,swell_wave_period,sea_surface_temperature,sea_level_height_msl" +
      "&timezone=Europe%2FLisbon&past_days=2&forecast_days=2&cell_selection=sea";
    Promise.allSettled([fetchJson(fUrl, 15000), fetchJson(mUrl, 15000)]).then(([f, m]) => {
      if (f.status !== "fulfilled") { pend.forEach((s) => { delete spotScores[spotKey(s[1], s[2])]; }); return; }
      const fa = Array.isArray(f.value) ? f.value : [f.value];
      const ma = m.status === "fulfilled" ? (Array.isArray(m.value) ? m.value : [m.value]) : [];
      pend.forEach((s, i) => {
        try {
          const wx = fa[i], sea = ma[i] && ma[i].hourly && ma[i].hourly.wave_height.some((v) => v != null) ? ma[i] : null;
          if (!wx) return;
          spotScores[spotKey(s[1], s[2])] = computeAll({ name: s[0], lat: s[1], lon: s[2] }, s[3], wx, sea).score;
        } catch (e) { delete spotScores[spotKey(s[1], s[2])]; }
      });
      drawSpots();
    });
  }, 400);
}
// O nó do mapa é criado uma vez e re-anexado a cada render — recriar o mapa
// perdia tiles, zoom e camada escolhida.
let MAPEL = null;
function attachMap() {
  const slot = document.getElementById("mapSlot");
  if (!slot || typeof L === "undefined") return;
  if (!MAPEL) { MAPEL = document.createElement("div"); MAPEL.id = "leafletMap"; }
  if (MAPEL.parentNode !== slot) slot.appendChild(MAPEL);
  if (!LMAP) mountMap();
  else setTimeout(() => LMAP.invalidateSize(), 50);
}
function mountMap() {
  const el = MAPEL;
  if (!el || typeof L === "undefined") return;
  const center = st.spot ? [st.spot.lat, st.spot.lon] : [39.5, -9.0];
  LMAP = L.map(el, { zoomControl: true, attributionControl: true }).setView(center, st.spot ? 13 : 8);
  LTILE = tileLayerFor(st.mapLayer).addTo(LMAP);
  LSPOTS = L.layerGroup().addTo(LMAP);
  LMAP.on("click", (e) => {
    const { lat, lng } = e.latlng;
    const near = nearestSpot(lat, lng);
    if (near.km <= 12) selectSpot(near.spot);
    else selectSpot({ name: "Ponto na costa (" + lat.toFixed(3) + "°N)", lat, lon: lng, tipo: null });
  });
  LMAP.on("moveend zoomend", loadVisibleScores);
  drawSpots();
  drawUser();
  loadVisibleScores();
}
// O painel tapa parte do mapa (em baixo no telemóvel, à esquerda no desktop):
// o centro é deslocado para o alvo ficar na zona realmente visível.
function panelOffset() {
  const p = st.mapExpanded && !st.panelClosed ? document.querySelector(".map-panel") : null;
  if (!p) return { x: 0, y: 0 };
  const r = p.getBoundingClientRect();
  return window.innerWidth >= 860 ? { x: -r.width / 2, y: 0 } : { x: 0, y: r.height / 2 };
}
function setViewAdjusted(lat, lon, zoom) {
  if (!LMAP) return;
  const z = zoom == null ? LMAP.getZoom() : zoom;
  const o = panelOffset();
  if (!o.x && !o.y) { LMAP.setView([lat, lon], z, { animate: true }); return; }
  const pt = LMAP.project([lat, lon], z).add([o.x, o.y]);
  LMAP.setView(LMAP.unproject(pt, z), z, { animate: true });
}
function syncMarker() {
  if (!LMAP || !st.spot) return;
  drawSpots();
  setViewAdjusted(st.spot.lat, st.spot.lon, Math.max(LMAP.getZoom(), 13));
  loadVisibleScores();
}

// Um só campo de pesquisa em cada momento (cabeçalho OU mapa expandido),
// para não haver ids duplicados.
function searchWidget() {

  const items = showResults ? (st.results.length
    ? st.results.map((r, i) => `<button class="result-item" data-ri="${i}"><span class="result-name">${esc(r.name)}</span><span class="result-meta">${esc(r.meta || "")}</span></button>`).join("")
    : `<div class="results-empty">Sem resultados para "${esc(st.query)}".<br>Tenta o nome de uma praia, molhe ou vila costeira.</div>`) : "";
  return `

// Catmull-Rom → Bézier, para a curva sair suave a partir de pontos horários
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += "C" + (p1.x + (p2.x - p0.x) / 6).toFixed(1) + "," + (p1.y + (p2.y - p0.y) / 6).toFixed(1) +
         " " + (p2.x - (p3.x - p1.x) / 6).toFixed(1) + "," + (p2.y - (p3.y - p1.y) / 6).toFixed(1) +
         " " + p2.x.toFixed(1) + "," + p2.y.toFixed(1);
  }
  return d;
}
function renderTideChart(vm) {
  const S = vm.tideSeries || [];
  if (S.length < 6) return "";
  const W = 360, H = 132, PADX = 6, TOP = 20, BOT = 96; // BOT = linha de base da curva
  const t0 = new Date(S[0].t).getTime(), t1 = new Date(S[S.length - 1].t).getTime();
  const etas = S.map((p) => p.eta);
  let lo = Math.min.apply(null, etas), hi = Math.max.apply(null, etas);
  if (hi - lo < 0.2) { hi += 0.1; lo -= 0.1; }
  const X = (ms) => PADX + (ms - t0) / (t1 - t0) * (W - 2 * PADX);
  const Y = (e) => TOP + (hi - e) / (hi - lo) * (BOT - TOP);
  const pts = S.map((p) => ({ x: X(new Date(p.t).getTime()), y: Y(p.eta) }));
  const line = smoothPath(pts);
  const area = line + "L" + pts[pts.length - 1].x.toFixed(1) + "," + (BOT + 6) + "L" + pts[0].x.toFixed(1) + "," + (BOT + 6) + "Z";
  const marks = (vm.tideMarks || []).map((m) => {
    const x = X(m.ms), y = Y(m.eta), alta = m.tipo === "alta";
    if (x < PADX - 2 || x > W - PADX + 2) return "";
    const tx = clamp(x, 18, W - 18);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--bg-elevated)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${(alta ? y - 9 : y + 16).toFixed(1)}" text-anchor="middle"
        font-size="11" font-weight="700" fill="var(--text)" stroke="var(--bg-elevated)" stroke-width="3.5"
        paint-order="stroke" style="font-family:system-ui,sans-serif">${m.hm}</text>`;
  }).join("");
  // etiquetas de dia por baixo
  const days = [];
  S.forEach((p) => {
    const d = p.t.slice(0, 10);
    if (!days.length || days[days.length - 1].d !== d) days.push({ d, ms: new Date(p.t).getTime() });
  });
  const hoje = S[0].t.slice(0, 10);
  const dayTicks = days.map((dd, i) => {
    const x = i === 0 ? PADX : X(dd.ms);
    return `<line x1="${x.toFixed(1)}" y1="${TOP - 6}" x2="${x.toFixed(1)}" y2="${BOT + 6}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${(x + 4).toFixed(1)}" y="${H - 6}" font-size="10.5" fill="var(--text-faint)" style="font-family:system-ui,sans-serif">${esc(i === 0 ? "agora" : diaLabel(dd.d, hoje))}</text>`;
  }).join("");
  return `
    <svg class="tide-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva da maré para as próximas 48 horas">
      <defs><linearGradient id="tideFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
      </linearGradient></defs>
      ${dayTicks}
      <path d="${area}" fill="url(#tideFill)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${marks}
    </svg>`;
}

  return d / 60;

function durTexto(f) {

function renderCal(f) {

  const offset = (primeiro.getDay() + 6) % 7;         // semana começa à segunda
  const dias = new Date(ano, m + 1, 0).getDate();
  const hojeS = ymd(new Date()), selS = ymd(f.dia);

let debounceT = null;

function syncForm() { // guarda o que está escrito antes de re-render
  if (!st.form) return;
  const g = (id) => { const e = document.getElementById(id); return e ? e.value : null; };

  st.form.fm = clamp(Math.round(num("fFM", st.form.fm)) || 0, 0, 59);

  const l = g("fLocal"); if (l != null) st.form.local = l;
