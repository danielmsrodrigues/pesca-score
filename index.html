// Um só handler para todos os steppers, delegado no documento
function attachSteppers() {
  document.querySelectorAll(".stepper").forEach((s) => {
    const inp = s.querySelector("[data-val]");
    const step = +s.dataset.step, mn = +s.dataset.min, mx = +s.dataset.max,
          dec = +s.dataset.dec, pad = +s.dataset.pad, vazio = s.dataset.vazio === "1";
    const fmt = (v) => {
      let t = dec ? v.toFixed(dec) : String(Math.round(v));
      if (pad) t = t.padStart(pad, "0");
      return t;
    };
    s.querySelectorAll("button[data-dir]").forEach((b) => b.addEventListener("click", (e) => {
      e.preventDefault();
      const dir = +b.dataset.dir;
      const base = s.dataset.base === "" ? mn : +s.dataset.base;
      let v = parseFloat(inp.value);
      if (isNaN(v)) v = base;      // a partir de vazio, arranca num valor útil
      else v = v + dir * step;
      if (v > mx) v = mn;          // hora/minuto dão a volta
      if (v < mn) v = vazio && dir < 0 ? NaN : mx;
      inp.value = isNaN(v) ? "" : fmt(v);
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    }));
    inp.addEventListener("blur", () => {
      if (inp.value === "" && vazio) return;
      let v = parseFloat(inp.value);
      if (isNaN(v)) v = mn;
      inp.value = fmt(clamp(v, mn, mx));
    });
    // com o campo focado, ↑ e ↓ mexem o valor
    inp.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      s.querySelector(`button[data-dir="${e.key === "ArrowUp" ? 1 : -1}"]`).click();
    });
    inp.addEventListener("focus", () => inp.select());
  });
}
function attachLog() {
  const on = (id, fn, ev) => { const e = document.getElementById(id); if (e) e.addEventListener(ev || "click", fn); };
  attachSteppers();
  // duração ao vivo, sem re-render (para não perder o foco no campo)
  const hint = document.querySelector(".dur-hint");
  if (hint && st.form) {
    const atualiza = () => {
      const v = (id) => { const e = document.getElementById(id); return e ? (parseInt(e.value, 10) || 0) : 0; };
      const f = { h: v("fH"), m: v("fM"), fh: v("fFH"), fm: v("fFM") };
      const p = Math.max(1, v("fPesc") || 1);
      const tot = duracaoH(f) * p;
      hint.innerHTML = "Duração <b>" + esc(durTexto(f)) + "</b>" + (duracaoH(f) > 12 ? " — atravessa a meia-noite?" : "") +
        (p > 1 ? "<small>" + tot.toFixed(1) + " horas de pesca no total</small>" : "");
    };
    ["fH", "fM", "fFH", "fFM", "fPesc"].forEach((id) => {
      const e = document.getElementById(id);
      if (e) { e.addEventListener("input", atualiza); e.addEventListener("change", atualiza); }
    });
  }
  on("logNova", () => {
    const d = new Date();
    d.setMinutes(d.getMinutes() - 120); // por defeito: comecei há 2h
    d.setMinutes(Math.round(d.getMinutes() / 5) * 5);
    const fim = new Date();
    fim.setMinutes(Math.round(fim.getMinutes() / 5) * 5);
    st.form = { dia: new Date(d.getFullYear(), d.getMonth(), d.getDate()),
      h: d.getHours(), m: d.getMinutes(), fh: fim.getHours(), fm: fim.getMinutes(),
      pescadores: 1, local: st.spot ? st.spot.name : "", nota: "", capturas: [], localSug: null, calOpen: false };
    render();
  });
  on("dAbrir", (e) => {
    e.stopPropagation(); syncForm();
    st.form.calOpen = !st.form.calOpen;
    st.form.calMes = new Date(st.form.dia.getFullYear(), st.form.dia.getMonth(), 1);
    render();
  });
  const mudaMes = (n) => {
    syncForm();
    const c = st.form.calMes;
    st.form.calMes = new Date(c.getFullYear(), c.getMonth() + n, 1);
    render();
  };
  on("calPrev", (e) => { e.stopPropagation(); mudaMes(-1); });
  on("calNext", (e) => { e.stopPropagation(); mudaMes(1); });
  document.querySelectorAll("[data-cald]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation(); syncForm();
    const [y, mo, d] = b.getAttribute("data-cald").split("-").map(Number);
    st.form.dia = new Date(y, mo - 1, d);
    st.form.calOpen = false;
    render();
  }));
  if (st.form && st.form.calOpen && !st._calDoc) {
    st._calDoc = (e) => {
      if (!st.form || !st.form.calOpen) return;
      if (e.target.closest("#calPop") || e.target.closest("#dAbrir")) return;
      syncForm();
      st.form.calOpen = false; render();
    };
    document.addEventListener("click", st._calDoc);
  }
  document.querySelectorAll("[data-dia]").forEach((b) => b.addEventListener("click", () => {
    syncForm();
    const d = new Date(); d.setDate(d.getDate() - +b.getAttribute("data-dia"));
    st.form.dia = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    render();
  }));
  // sugestões do pesqueiro enquanto se escreve
  const fl = document.getElementById("fLocal");
  if (fl) {
    let t = null;
    fl.addEventListener("input", () => {
      // syncForm() antes de qualquer render: sem isto, escrever o pesqueiro
      // redesenhava o formulário e repunha as horas no valor por defeito
      syncForm();
      clearTimeout(t);
      const q = fl.value.trim();
      if (q.length < 2) { if (st.form.localSug) { st.form.localSug = null; render(); reFocus("fLocal"); } return; }
      const fq = fold(q);
      const locais = SPOTS.filter((s) => fold(s[0]).includes(fq)).slice(0, 6)
        .map((s) => ({ name: s[0], lat: s[1], lon: s[2], tipo: s[3], meta: TIPO_LABEL[s[3]] }));
      if (locais.length) { st.form.localSug = locais; render(); reFocus("fLocal"); return; }
      t = setTimeout(() => {
        geocode(q).then((r) => {
          if (!st.form) return;
          syncForm();
          st.form.localSug = r.slice(0, 6);
          render(); reFocus("fLocal");
        });
      }, 350);
    });
  }
  document.querySelectorAll("[data-lsug]").forEach((b) => b.addEventListener("click", () => {
    const s = st.form.localSug[+b.getAttribute("data-lsug")];
    syncForm();
    st.form.local = s.name; st.form.coords = { lat: s.lat, lon: s.lon, tipo: s.tipo };
    st.form.localSug = null;
    render();
  }));
  on("logMais", () => { st.logAll = true; render(); });
  on("fAdd", () => { syncForm(); st.form.capturas.push({ especie: "", n: 1, cm: "" }); render(); });
  on("fCancelar", () => { st.form = null; render(); });
  document.querySelectorAll("[data-rmcap]").forEach((b) => b.addEventListener("click", () => {
    syncForm(); st.form.capturas.splice(+b.getAttribute("data-rmcap"), 1); render();
  }));
  document.querySelectorAll("[data-rmses]").forEach((b) => b.addEventListener("click", () => {
    if (!confirm("Apagar esta pescaria?")) return;
    writeLog(readLog().filter((s) => s.id !== b.getAttribute("data-rmses")));
    render();
  }));
  on("fGravar", (e) => {
    syncForm();
    const f = st.form;
    f.horas = duracaoH(f);
    const ini = new Date(f.dia.getFullYear(), f.dia.getMonth(), f.dia.getDate(), f.h, f.m);
    const caps = f.capturas.filter((c) => c.especie).map((c) => ({ especie: c.especie, n: Math.max(1, +c.n || 1), cm: c.cm ? +c.cm : null }));
    const co = f.coords || st.spot;
    const spot = { name: f.local || (st.spot ? st.spot.name : "—"), lat: co ? co.lat : null, lon: co ? co.lon : null,
                   tipo: (f.coords && f.coords.tipo) || st.shoreType };
    const btn = e.currentTarget;
    // as condições são sempre recalculadas para a data e o local indicados,
    // mesmo numa edição — mudar a data ou o pesqueiro muda tudo
    btn.disabled = true;
    btn.textContent = "A obter as condições de " + f.dia.toLocaleDateString("pt-PT", { day: "numeric", month: "short" }) + "…";
    condParaSessao(spot, spot.tipo, ini.toISOString(), f.horas).then((cond) => {
      const base = { v: LOG_V, pescador: anglerId(), inicio: ini.toISOString(),
        horas: Math.round(f.horas * 10) / 10, pescadores: f.pescadores || 1,
      spot, capturas: caps, nota: (f.nota || "").trim(), cond };
      const l = readLog();
      if (f.editId) {
        const i = l.findIndex((s) => s.id === f.editId);
        if (i >= 0) l[i] = Object.assign({}, l[i], base, { editadoEm: new Date().toISOString() });
        l.sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
        writeLog(l);
      } else {
        addSession(Object.assign({ id: uid(), criadoEm: new Date().toISOString() }, base));
      }
      st.form = null;
      render();
    });
  });
  document.querySelectorAll("[data-edses]").forEach((b) => b.addEventListener("click", () => {
    const s = readLog().find((x) => x.id === b.getAttribute("data-edses"));
    if (!s) return;
    const ini = new Date(s.inicio), fim = new Date(ini.getTime() + s.horas * 3600000);
    st.form = { editId: s.id, dia: new Date(ini.getFullYear(), ini.getMonth(), ini.getDate()),
      h: ini.getHours(), m: ini.getMinutes(), fh: fim.getHours(), fm: fim.getMinutes(),
      pescadores: s.pescadores || 1, local: s.spot ? s.spot.name : "", nota: s.nota || "",
      capturas: (s.capturas || []).map((c) => ({ especie: c.especie, n: c.n, cm: c.cm || "" })),
      coords: s.spot && s.spot.lat != null ? { lat: s.spot.lat, lon: s.spot.lon, tipo: s.spot.tipo } : null,
      localSug: null, calOpen: false };
    render();
    const el = document.querySelector(".log-form");
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }));
  on("logRecalc", (e) => {
    const l = readLog();
    if (!l.length || !confirm("Ir buscar de novo as condições reais de cada pescaria? (" + l.length + " registos)")) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    let i = 0, ok = 0, fora = 0;
    const passo = () => {
      if (i >= l.length) {
        writeLog(l); render();
        alert("Atualizados " + ok + " de " + l.length + (fora ? " (" + fora + " fora do alcance dos dados, mais de 88 dias)" : ""));
        return;
      }
      const s = l[i];
      btn.textContent = "A recalcular " + (i + 1) + "/" + l.length + "…";
      condParaSessao(s.spot || {}, (s.spot && s.spot.tipo) || "praia", s.inicio, s.horas).then((c) => {
        if (c && c.foraDeAlcance) fora++;
        else if (c) { s.cond = c; ok++; }
        i++; setTimeout(passo, 250); // sem martelar a API
      });
    };
    passo();
  });
  on("logExp", exportLog);
  on("logImp", () => { const f = document.getElementById("logFile"); if (f) f.click(); });
  on("logFile", (e) => { if (e.target.files && e.target.files[0]) importLog(e.target.files[0]); }, "change");
}
function focusEnd() {
  const inp = document.getElementById("searchInput");
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function selectSpot(r) {
  st.spot = { name: r.name, lat: r.lat, lon: r.lon };
  st.panelClosed = false;
  st.shoreType = r.tipo || shoreTypeGuess(r.lat, r.lon);
  st.results = null; st.query = ""; st.factorsOpen = false;
  persist();
  load();
}
function useGeolocation() {
  if (!navigator.geolocation) { render(); return; }
  st.geoBusy = true; render();
  navigator.geolocation.getCurrentPosition((pos) => {
    st.geoBusy = false;
    const { latitude, longitude, accuracy } = pos.coords;
    st.userPos = { lat: latitude, lon: longitude, acc: accuracy };
    drawUser();
    const near = nearestSpot(latitude, longitude);
    selectSpot(near.spot);
    // enquadrar a minha posição e o pesqueiro escolhido, fora da zona do painel
    setTimeout(() => {
      if (!LMAP) return;
      const p = st.mapExpanded && !st.panelClosed ? document.querySelector(".map-panel") : null;
      const r = p ? p.getBoundingClientRect() : null;
      const wide = window.innerWidth >= 860;
      LMAP.fitBounds(L.latLngBounds([[latitude, longitude], [near.spot.lat, near.spot.lon]]).pad(0.35), {
        maxZoom: 14,
        paddingTopLeft: [r && wide ? r.width + 20 : 20, 20],
        paddingBottomRight: [20, r && !wide ? r.height + 20 : 20],
      });
    }, 160);
  }, () => { st.geoBusy = false; render(); }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 });
}
function persist() {
  try { localStorage.setItem("pesca:last", JSON.stringify({ spot: st.spot, shoreType: st.shoreType })); } catch (e) {}
}
function cacheVm() {
  try { localStorage.setItem("pesca:vm", JSON.stringify({ vm: st.vm, spot: st.spot, shoreType: st.shoreType, at: Date.now() })); } catch (e) {}
}
function load() {
  if (!st.spot) { render(); return; }
  if (st.shoreType === "interior") { st.loading = false; st.busy = false; st.vm = null; render(); return; }
  // Se já há conteúdo no ecrã, atualizar em silêncio: substituir tudo por
  // esqueletos a cada troca de pesqueiro parecia um refresh da página.
  st.loading = !st.vm;
  st.busy = true; st.error = null; st.offline = false;
  render();
  const reqSpot = st.spot;
  const doce = st.shoreType === "albufeira";
  const alb = doce ? albufeiraPerto(st.spot.lat, st.spot.lon) : null;
  Promise.allSettled([
    fetchWx(st.spot.lat, st.spot.lon),
    doce ? Promise.resolve(null) : fetchSea(st.spot.lat, st.spot.lon),
    alb ? fetchNivel(alb.a[3]) : Promise.resolve(null),
  ]).then(([w, s, nv]) => {
    if (st.spot !== reqSpot) return; // o utilizador já mudou de sítio
    st.loading = false; st.busy = false;
    if (w.status !== "fulfilled") {
      // tentar cache
      try {
        const c = JSON.parse(localStorage.getItem("pesca:vm") || "null");
        if (c && c.vm) { st.vm = c.vm; st.spot = c.spot; st.shoreType = c.shoreType; st.offline = true; render(); return; }
      } catch (e) {}
      st.error = "Verifica a ligação à internet e tenta de novo."; st.vm = null;
      render(); return;
    }
    const sea = s.status === "fulfilled" ? s.value : null;
    const nivel = nv && nv.status === "fulfilled" ? nv.value : null;
    st.raw = { wx: w.value, sea, nivel };
    try {
      st.vm = doce
        ? computeDoce(Object.assign({}, st.spot, { frio: alb && alb.a[4] === 1, funda: alb && alb.a[4] === 1 }), w.value, nivel)
        : computeAll(st.spot, st.shoreType, w.value, sea);
      cacheVm();
    } catch (e) {
      st.error = "Erro a calcular o score (" + e.message + ")."; st.vm = null;
    }
    render();
    syncMarker();
  });
}

/* ============================ DEV (?dev=1) ============================ */
if (/[?&]dev=1/.test(location.search)) {
  document.body.classList.add("dev");
  const sw = document.getElementById("devSwitcher");
  const DEVS = [["real", "Real"], ["loading", "A carregar"], ["erro", "Erro rede"], ["vazio", "Sem local"]];
  sw.innerHTML = DEVS.map(([id, l]) => `<button data-dev="${id}">${l}</button>`).join("");
  sw.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-dev]");
    if (!b) return;
    sw.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    const m = b.getAttribute("data-dev");
    if (m === "loading") { st.loading = true; st.error = null; render(); }
    else if (m === "erro") { st.loading = false; st.vm = null; st.error = "Simulação de falha de rede."; render(); }
    else if (m === "vazio") { st.loading = false; st.vm = null; st.error = null; st.spot = null; render(); }
    else load();
  });
}

/* ============================ BOOT ============================ */
// Ao entrar, pedir sempre a localização e abrir no pesqueiro mais próximo.
// O último sítio guardado é só o plano B (permissão negada ou sem suporte).
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("pesca:last") || "null"); } catch (e) {}
  const fallback = () => {
    st.geoBusy = false;
    if (saved && saved.spot) { st.spot = saved.spot; st.shoreType = saved.shoreType || "praia"; }
    else { st.spot = { name: "Molhe de Peniche", lat: 39.349, lon: -9.376 }; st.shoreType = "paredao"; }
    load();
  };
  if (!navigator.geolocation) { fallback(); return; }
  st.geoBusy = true; st.loading = true;
  render();
  navigator.geolocation.getCurrentPosition((pos) => {
    st.geoBusy = false;
    st.userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
    const near = nearestSpot(pos.coords.latitude, pos.coords.longitude);
    selectSpot(near.spot);
  }, fallback, { enableHighAccuracy: true, timeout: 9000, maximumAge: 120000 });
})();

})();
